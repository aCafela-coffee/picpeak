name: PicPeak AIO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fetch the pinned official source (never follows main)
        run: git fetch --no-tags --depth=1 https://github.com/PicPeak/picpeak.git ec7b22354fd6b5a66aec9e2a965e22fbcf7334f2
      - name: Official backend and accounting source integrity
        run: node scripts/ci/check-official-source.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - name: Translation integrity
        run: node scripts/check-korean-locales.cjs
      - name: Frontend types, build, lint and full test suite
        working-directory: frontend
        run: |
          npm run build:check
          npm run lint
          npm test -- --run
      - uses: docker/setup-buildx-action@v3
      - name: Build native AIO without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aio
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: picpeak-aio:verified-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=aio-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=aio-${{ matrix.arch }}
      - name: Backend, migrations and inherited runtime invariant
        run: python3 scripts/ci/image-invariants.py picpeak-aio:verified-${{ matrix.arch }}
      - name: Previous official to new official to Korean to same official verification
        run: node scripts/ci/aio-smoke.cjs picpeak-aio:verified-${{ matrix.arch }} linux/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-ui-${{ matrix.arch }}
          path: /tmp/picpeak-korean-ui/*.png
          if-no-files-found: ignore
      - name: Export the verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save picpeak-aio:verified-${{ matrix.arch }} | gzip > aio-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: aio-${{ matrix.arch }}
          path: aio-${{ matrix.arch }}.tar.gz
          retention-days: 3
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aio-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Require the public package and current main commit
        run: node scripts/ci/package-visibility.cjs before
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture candidates
        env:
          IMAGE: ghcr.io/acafela-coffee/picpeak/aio
        run: |
          for arch in amd64 arm64; do
            docker load --input "aio-${arch}.tar.gz"
            docker tag "picpeak-aio:verified-${arch}" "${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${arch}"
            docker push "${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${arch}"
          done
      - name: Verify package visibility before updating stable tags
        run: node scripts/ci/package-visibility.cjs after
      - name: Publish SHA manifest, then main
        env:
          IMAGE: ghcr.io/acafela-coffee/picpeak/aio
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-amd64" "${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-arm64"
          node scripts/ci/package-visibility.cjs after
          docker buildx imagetools create --tag "${IMAGE}:main" "${IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE}:main"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SHA and main manifests and anonymous downloads
        run: node scripts/ci/check-published-image.cjs
